[project]
name = "repo-tools"
version = "0.1.0"
description = "Small scripts for working across a folder of sibling git repos"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
    "ty>=0.0.99",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff.lint]
# Pin the rule set: Ruff 0.17 widened the defaults, which broke CI (unpinned ruff).
# S603/S607 flag subprocess use; sync_repos.py is a git wrapper, so it carries
# targeted noqa comments instead of a blanket ignore.
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "SIM", "RUF", "S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S603", "S607"]
