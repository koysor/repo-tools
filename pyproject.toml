[project]
name = "repo-tools"
version = "0.1.0"
description = "Small scripts for working across a folder of sibling git repos"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.14.13",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff.lint]
# Pin the rule set: Ruff 0.17 widened the defaults, which broke CI (unpinned ruff).
select = ["E4", "E7", "E9", "F"]
